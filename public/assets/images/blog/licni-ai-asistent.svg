<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><linearGradient id="bg"><stop stop-color="#dfeaee"/><stop offset="1" stop-color="#f4e3d6"/></linearGradient></defs><rect width="1200" height="720" fill="url(#bg)"/><g font-family="Arial,sans-serif" fill="#0b0f15"><text x="65" y="85" font-size="18" letter-spacing="4">MOJFLOW / LIČNI AI ASISTENT</text><text x="65" y="195" font-size="56">Manje obaveza</text><text x="65" y="262" font-size="56">u glavi.</text><text x="65" y="353" font-size="25">01  Pošaljete zahtev</text><text x="65" y="411" font-size="25">02  Pregledate predlog</text><text x="65" y="469" font-size="25">03  Potvrdite radnju</text><text x="65" y="642" font-size="18" fill="#535961">Ilustrativni razgovor, ne stvarna rezervacija.</text></g><rect x="655" y="60" width="480" height="600" rx="28" fill="#0b0f15"/><g font-family="Arial,sans-serif"><text x="691" y="116" font-size="24" fill="#f4f4f4">Vaš asistent</text><circle cx="1094" cy="107" r="7" fill="#c79780"/><rect x="720" y="150" width="380" height="105" rx="16" fill="#dfeaee"/><text x="742" y="186" font-size="21" fill="#0b0f15"><tspan x="742">Nađi šišanje u četvrtak,</tspan><tspan x="742" dy="31">posle posla. Do 2.000 din.</tspan></text><rect x="688" y="280" width="412" height="165" rx="16" fill="#25313b"/><text x="709" y="320" font-size="21" fill="#f4f4f4"><tspan x="709">Predlog: 18:15, cena 1.800 din.</tspan><tspan x="709" dy="35">Kalendar je slobodan.</tspan><tspan x="709" dy="45" fill="#dfb29d">Da potvrdim rezervaciju?</tspan></text><rect x="848" y="474" width="252" height="65" rx="16" fill="#dfeaee"/><text x="869" y="515" font-size="21" fill="#0b0f15">Potvrđujem 18:15.</text><text x="691" y="603" font-size="17" fill="#bdc2c8">Rezervacija tek po odgovoru salona.</text></g></svg>
